<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - EcuaConect</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdiNGdg7AXxwoabv2VXD59iZly1WVa2J6XXg&s" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/inicioSesion.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <header class="auth-header">
        <h1 class="app-titulo">EcuaConect</h1>
        <div class="header-logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdiNGdg7AXxwoabv2VXD59iZly1WVa2J6XXg&s" alt="Logo" width="100" height="100">
        </div>
    </header>

    <main>
        <section class="auth-section">
            <h2>Inicio de Sesión</h2>
            <p class="text-muted text-center">Ingrese sus credenciales para acceder al sistema</p>

            <form action="principal.html" method="get" class="auth-form">

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold small text-muted">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="password" class="form-label fw-bold small text-muted">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required
                            minlength="8" maxlength="16"
                            pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&.#_-])[A-Za-z\d@$!%*?&.#_-]{8,16}"
                            title="Debe incluir letras, números y al menos un carácter especial">
                    </div>
                    <p class="hint-text mt-1">Entre 8 y 16 caracteres, con letras, números y un carácter especial.</p>
                </div>

                <p class="link-registro text-center mb-3">
                    <a href="registro.html">¿No tienes cuenta? Crea una</a>
                </p>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn-primary-auth">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Iniciar Sesión
                    </button>
                    <button type="button" class="btn-secondary-auth">
                        <i class="fab fa-google me-2"></i> Continuar con Google
                    </button>
                </div>

            </form>
        </section>
    </main>

    <footer class="auth-footer">
        <p>Creado por Keonjae Lee</p>
        <p>Clase de Fundamentos Web</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/validacion.js"></script>
    <script src="js/registro.js"></script>
    <script src="js/inicioSesion.js"></script>
</body>

</html>
