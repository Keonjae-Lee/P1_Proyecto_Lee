<body style="background-color: #f5f0e8; font-family: Arial, sans-serif;">

    <h1 style="background-color: rgb(231, 156, 51); padding: 1%; color: #ffffff; margin: 0;">EcuaConect</h1>

    <main style="max-width: 600px; margin: 0 auto; padding: 20px 30px 100px;">

        <h2 style="color: #c0622a; border-bottom: 2px solid #c0622a; padding-bottom: 8px;">Mi Carrito</h2>

                <p style="margin: 4px 0 0; color: #c0622a; font-size: 1rem;">$30</p>

            <div style="display: flex; align-items: center; gap: 8px;">

                <p>1</p>
                <button style="padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px; background-color: white; cursor: pointer; font-size: 1rem;">+</button>
            </div>
            <a href="#" style="color: #aaa; text-decoration: none; font-size: 1.2rem;">X</a>

                alt="Artesanía" style="width: 70px; height: 70px; border-radius: 8px;">
            <div style="flex: 1;">
                <p style="margin: 0; font-weight: bold;">Jarrón de Barro Negro</p>
                <p style="margin: 4px 0 0; color: #777; font-size: 0.85rem;">Doña Rosa · Quitumbe</p>
                <p style="margin: 4px 0 0; color: #c0622a; font-size: 1rem;">$45</p>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button style="padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px; background-color: white; cursor: pointer; font-size: 1rem;">−</button>
                <p>1</p>
                <button style="padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px; background-color: white; cursor: pointer; font-size: 1rem;">+</button>

        </div>

        <div style="background-color: white; border-radius: 10px; padding: 20px; margin-top: 10px;">
            <p style="font-size: 0.8rem; color: #777; margin: 0 0 12px; text-transform: uppercase;">Resumen del pedido</p>

            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <p style="color: #555;">Subtotal</p>
                <p>$75</p>

            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">

            <div style="display: flex; justify-content: space-between; border-top: 1px solid #ddd; padding-top: 12px; margin-top: 8px;">

            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button style="flex: 1; padding: 15px; border: 2px solid #c0622a; background-color: white; border-radius: 10px; font-size: 1rem; cursor: pointer;">

                <button style="flex: 1; padding: 15px; background-color: #c0622a; color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer;">
