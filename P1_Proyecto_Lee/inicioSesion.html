<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdiNGdg7AXxwoabv2VXD59iZly1WVa2J6XXg&s" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="background-color: rgb(245, 240, 232); align-items: center; font-family: Arial, sans-serif;">

    <section style="margin: 20px 700px;">
        <h1 style="text-align: center;">Inicio de Sesión</h1>
        <p style="color: rgb(118, 118, 118); text-align: center;">Ingrese sus credenciales para acceder al sistema</p>

        <form action="principal.html" method="post" style="background-color: white; padding: 30px; border-radius: 30px; width: 400px; text-align: center;">

            <label for="email" style="display: block;">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required
                style="padding: 10px; width: 60%; border: 1px solid; border-radius: 15px;"> <br><br>

            <label for="password" style="display: block;">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required
                minlength="8" maxlength="16"
                pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&.#_-])[A-Za-z\d@$!%*?&.#_-]{8,16}"
                title="Debe incluir letras, números y al menos un carácter especial (@$!%*?&.#_-)"
                style="padding: 10px; width: 60%; border: 1px solid; border-radius: 15px;"> <br>
            
            <p style="color: #777; font-size: 0.7rem;">Entre 8 y 16 caracteres, con letras, números y un carácter especial.</p>

            <p>
                <a href="registro.html" style="color: #777; font-size: 0.9rem;">¿No tienes cuenta? Crea una</a>
            </p>

            <button type="submit" href="principal.html"
            style="width: 65%; padding: 10px; background-color: #d4763b; color: white; border-radius: 10px;">
                Iniciar Sesión
            </button><br><br>
            <button type="submit" href="principal.html"
            style="width: 65%; padding: 10px; background-color: #f0ecea; color: rgb(0, 0, 0); border-radius: 10px;">
                <i class="fab fa-google"></i> Google
            </button>

        </form>
    </section>

    <footer style="margin-top: 40px; text-align: center; color: #777;">
        <p>Creado por Keonjae Lee</p>
        <p>Clase de Fundamentos Web</p>
    </footer>

</body>

</html>
